<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusFlow</title>
<style>
:root{
  --bg:#0b0b12;--bg-elev:#14141f;--surface:#1a1a28;--surface-hover:#22223a;--border:#2a2a40;
  --text:#f4f4fa;--text-muted:#9a9ab4;--text-faint:#5e5e78;
  --accent-from:#6366f1;--accent-to:#a855f7;
  --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;
  --radius-card:16px;--radius-control:10px;--radius-pill:999px;
  --density:1;--font-scale:1;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:calc(15px*var(--font-scale))/1.5 var(--font-ui)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input[type=text],input[type=date],input[type=time],input:not([type]){
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-control);padding:8px 10px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--accent-from)}
select,input[type=file]{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-control);padding:6px}
input[type=range]{width:100%}
input[type=color]{width:100%;height:36px;border:0;background:none;padding:0}
label{display:block;margin:8px 0}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--bg-elev);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:700;font-size:1.15em;padding:0 8px;background:linear-gradient(90deg,var(--accent-from),var(--accent-to));-webkit-background-clip:text;color:transparent}
nav{display:flex;flex-direction:column;gap:4px}
nav button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:var(--radius-control);color:var(--text-muted)}
nav button:hover{background:var(--surface-hover);color:var(--text)}
nav button.active{background:var(--surface);color:var(--text);box-shadow:inset 2px 0 0 var(--accent-from)}
.tagline{margin-top:auto;padding:0 8px}
main{display:flex;flex-direction:column;min-width:0}
#main{padding:28px 28px 8px;max-width:1000px;width:100%}

.muted{color:var(--text-muted)}
.faint{color:var(--text-faint)}
.small{font-size:.85em}
.grow{flex:1;min-width:0}
.head{margin-bottom:18px}
.head h1{margin:0 0 2px;font-size:1.6em;font-weight:650}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);
  padding:calc(18px*var(--density));margin-bottom:16px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card h3{margin:0 0 12px;font-size:1em}
.row{display:flex;align-items:center;gap:12px;padding:calc(9px*var(--density)) 8px;border-radius:var(--radius-control)}
.row:hover{background:var(--surface-hover)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.row-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.title{font-size:1.2em;font-weight:600}
.title-sm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.is-done .title-sm{text-decoration:line-through;color:var(--text-faint)}
.meta{color:var(--text-muted);font-size:.82em;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{background:var(--surface-hover);border:1px solid var(--border);border-radius:var(--radius-pill);padding:0 8px;font-size:.85em;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.p1{background:var(--danger)}.p2{background:var(--warning)}.p3{background:var(--accent-from)}.p4{background:var(--text-faint)}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);background:none;flex:none;padding:0;display:grid;place-items:center;transition:all .2s}
.check.on{background:linear-gradient(135deg,var(--accent-from),var(--accent-to));border-color:transparent}
.check.on::after{content:"✓";color:#fff;font-size:12px}

.btn-primary{background:linear-gradient(135deg,var(--accent-from),var(--accent-to));border:0;color:#fff;padding:8px 14px;border-radius:var(--radius-control);box-shadow:0 8px 24px -10px var(--accent-from);transition:transform .15s,box-shadow .15s}
.btn-primary:hover{transform:translateY(-1px)}
.btn-primary:disabled{opacity:.6;cursor:default;transform:none}
.btn-ghost{background:none;border:1px solid var(--border);padding:6px 10px;border-radius:var(--radius-control);color:var(--text-muted);display:inline-block}
.btn-ghost:hover{color:var(--text);background:var(--surface-hover)}
.btn-danger{background:none;border:1px solid var(--danger);color:var(--danger);padding:6px 10px;border-radius:var(--radius-control)}

.progress .bar{height:6px;background:var(--surface-hover);border-radius:var(--radius-pill);overflow:hidden;margin-top:8px}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-from),var(--accent-to));transition:width .4s}
.now{display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 0 0 1px var(--accent-from) inset}
.timer{font-variant-numeric:tabular-nums;font-size:1.4em;font-weight:600}

.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.preset{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-control);padding:10px;text-align:left;display:flex;align-items:center;gap:8px}
.preset.on{border-color:var(--accent-from);box-shadow:0 0 0 1px var(--accent-from)}
.sw{width:18px;height:18px;border-radius:6px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.bars{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:10px}
.bar-col{flex:1;height:100%;display:flex;align-items:flex-end;background:var(--surface-hover);border-radius:6px;overflow:hidden}
.bar-col i{display:block;width:100%;background:linear-gradient(180deg,var(--accent-to),var(--accent-from));border-radius:6px 6px 0 0;min-height:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.kpi b{font-size:1.8em;display:block}

/* Часы и погода */
.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:14px;margin-bottom:16px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.clock-card{display:flex;flex-direction:column;justify-content:space-between;min-height:200px;
  background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--accent-from) 22%,transparent),transparent 60%),var(--surface)}
.clock{font-size:3.4em;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums;
  background:linear-gradient(90deg,var(--text) 40%,var(--accent-to));-webkit-background-clip:text;color:transparent}
.sync{display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.wx{min-height:200px;display:flex;flex-direction:column;gap:10px;transition:background .6s}
.wx::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent-to) 25%,transparent),transparent 70%);pointer-events:none}
.wx-clear{background:linear-gradient(140deg,rgba(251,191,36,.22),var(--surface) 70%)}
.wx-cloud{background:linear-gradient(140deg,rgba(148,163,184,.2),var(--surface) 70%)}
.wx-fog{background:linear-gradient(140deg,rgba(156,163,175,.25),var(--surface) 70%)}
.wx-rain{background:linear-gradient(140deg,rgba(59,130,246,.25),var(--surface) 70%)}
.wx-snow{background:linear-gradient(140deg,rgba(186,230,253,.25),var(--surface) 70%)}
.wx-storm{background:linear-gradient(140deg,rgba(139,92,246,.3),var(--surface) 70%)}
.wx-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wx-main{display:flex;align-items:center;gap:14px;margin-top:6px}
.wx-icon{font-size:3.2em;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.wx-temp{font-size:3em;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.wx-meta{display:flex;gap:14px;flex-wrap:wrap}
.hourly{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.hour{min-width:56px;text-align:center;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.04);font-size:.85em}
.hour b{display:block;font-size:1.05em;font-variant-numeric:tabular-nums}
.daily{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day{padding:8px;border-radius:12px;background:rgba(255,255,255,.04);text-align:center;font-size:.85em}
.day b{display:block}
.skel{height:14px;border-radius:6px;background:var(--surface-hover);animation:pulse 1.4s ease-in-out infinite}
.city-form{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.res{display:flex;flex-direction:column;gap:4px}
.res button{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-control);padding:7px 10px;text-align:left}
.res button:hover{border-color:var(--accent-from)}

/* Календарь */
.cal-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cal-title{margin:0 8px;font-size:1.2em;font-weight:650;text-transform:capitalize}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);padding:3px}
.seg button{background:none;border:0;padding:5px 12px;border-radius:var(--radius-pill);color:var(--text-muted)}
.seg button.on{background:var(--surface-hover);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.month{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;background:var(--surface)}
.month .wd{padding:8px;font-size:.78em;color:var(--text-faint);text-align:center;border-bottom:1px solid var(--border);text-transform:capitalize}
.cell{min-height:104px;padding:6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .15s}
.cell:nth-child(7n+7){border-right:0}
.cell.other{opacity:.38}
.cell:hover{background:var(--surface-hover)}
.cell .num{font-size:.85em;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;margin-bottom:2px}
.cell.today .num{background:linear-gradient(135deg,var(--accent-from),var(--accent-to));color:#fff;box-shadow:0 0 14px var(--accent-from)}
.pill{font-size:.74em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 6px;border-radius:6px;min-width:0}
.ev-pill{background:color-mix(in srgb,var(--accent-from) 22%,transparent);border-left:2px solid var(--accent-from)}
.tk-pill{background:var(--surface-hover);border-left:2px solid var(--text-faint)}
.tk-pill.p1{border-left-color:var(--danger)}.tk-pill.p2{border-left-color:var(--warning)}.tk-pill.p3{border-left-color:var(--accent-from)}
.more{font-size:.72em;color:var(--text-muted);padding-left:4px}

.tl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface)}
.tl-inner{min-width:calc(52px + var(--cols) * 92px)}
.tl-row{display:grid;grid-template-columns:52px repeat(var(--cols),1fr)}
.dayhead{padding:8px 4px;text-align:center;border-bottom:1px solid var(--border);font-size:.85em;text-transform:capitalize}
.dayhead.today b{color:var(--accent-to)}
.allrow{border-bottom:1px solid var(--border)}
.allday{min-height:36px;display:flex;flex-direction:column;gap:3px;padding:4px;border-left:1px solid var(--border)}
.tl-gutter{padding:8px 6px;font-size:.7em}
.tl-hours div{height:56px;font-size:.7em;color:var(--text-faint);padding:0 6px;transform:translateY(-7px)}
.tl-col{position:relative;height:1344px;border-left:1px solid var(--border);cursor:cell;
  background-image:repeating-linear-gradient(to bottom,var(--border) 0 1px,transparent 1px 56px)}
.tl-col:hover{background-color:rgba(255,255,255,.015)}
.blk{position:absolute;border-radius:8px;padding:4px 7px;font-size:.78em;overflow:hidden;cursor:pointer;
  transition:transform .15s,box-shadow .15s;min-width:0;line-height:1.3}
.blk:hover{transform:scale(1.01);box-shadow:0 6px 18px -8px rgba(0,0,0,.6);z-index:2}
.blk b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.ev{background:color-mix(in srgb,var(--accent-from) 26%,var(--surface));border-left:3px solid var(--accent-from)}
.blk.task{background:var(--surface-hover);border-left:3px dashed var(--text-faint)}
.blk.task.p1{border-left-color:var(--danger)}.blk.task.p2{border-left-color:var(--warning)}.blk.task.p3{border-left-color:var(--accent-from)}
.blk.task.done{opacity:.5;text-decoration:line-through}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--danger);box-shadow:0 0 8px var(--danger);z-index:1}
.now-line::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

.ev-row .time{font-variant-numeric:tabular-nums;color:var(--text-muted);min-width:110px}

.quickbar{position:sticky;bottom:0;margin-top:auto;padding:12px 28px 18px;background:linear-gradient(transparent,var(--bg) 40%)}
.quickbar input{width:100%;max-width:1000px;display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:12px 14px;outline:none}
.quickbar input:focus{border-color:var(--accent-from);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.preview{min-height:24px;margin:0 0 6px 4px;display:flex;gap:6px;flex-wrap:wrap}

.toast{position:fixed;right:20px;bottom:90px;background:var(--surface-hover);border:1px solid var(--border);border-radius:var(--radius-control);padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:50}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:var(--accent-to);font-weight:600}

dialog{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-card);padding:22px;width:min(440px,92vw);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}

@media (max-width:720px){
  .app{grid-template-columns:1fr}
  aside{flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--border)}
  nav{flex-direction:row}
  .tagline{display:none}
  #main{padding:18px 14px 6px}
  .quickbar{padding:10px 14px 14px}
  .grid2{grid-template-columns:1fr}
  .daily{grid-template-columns:repeat(2,1fr)}
  .toast{left:14px;right:14px;bottom:80px}
  .clock{font-size:2.6em}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">FocusFlow</div>
    <nav>
      <button data-view="today">Сегодня</button>
      <button data-view="calendar">Календарь</button>
      <button data-view="week">Неделя</button>
      <button data-view="stats">Статистика</button>
      <button data-view="settings">Настройки</button>
    </nav>
    <div class="tagline small">Планируй. Действуй. Достигай.</div>
  </aside>
  <main>
    <div id="main"></div>
    <div class="quickbar">
      <div id="preview" class="preview"></div>
      <input id="quick" autocomplete="off" placeholder="Новая задача (N — фокус сюда). Пример: завтра в 15:00 созвон #работа !высокий 1ч">
    </div>
  </main>
</div>

<dialog id="evDlg">
  <h3 id="evTitle" style="margin:0 0 14px">Событие</h3>
  <div style="display:grid;gap:10px">
    <input id="evName" placeholder="Название события" maxlength="300">
    <input id="evDate" type="date">
    <div class="grid2">
      <input id="evStart" type="time" title="Начало (пусто — весь день)">
      <input id="evEnd" type="time" title="Конец">
    </div>
    <input id="evPlace" placeholder="Место или ссылка (необязательно)" maxlength="300">
  </div>
  <div class="row-between" style="margin-top:18px">
    <button class="btn-danger" id="evDel" data-act="evDel">Удалить</button>
    <div class="row-wrap">
      <button class="btn-ghost" data-act="evCancel">Отмена</button>
      <button class="btn-primary" data-act="evSave">Сохранить</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>

<script>
'use strict';

/* ================= Константы ================= */
const KEY = 'focusflow.v2';
const OLD_KEY = 'focusflow.v1';
const HOUR_PX = 56;
const WX_INTERVAL = 15 * 60 * 1000;
const FOCUS_MS = 25 * 60 * 1000;

const DEFAULTS = {
  preset: 'midnight', accent: null, accent2: null,
  radius: 16, density: 1, fontScale: 1,
  weekStart: 1, timeFormat: '24', calView: 'month'
};
const PRESET_NAMES = { midnight:'Midnight', aurora:'Aurora', graphite:'Graphite', sunset:'Sunset', forest:'Forest', paper:'Paper', amoled:'AMOLED' };
const PRESETS = {
  midnight: {bg:'#0b0b12',bgElev:'#14141f',surface:'#1a1a28',surfaceHover:'#22223a',border:'#2a2a40',text:'#f4f4fa',muted:'#9a9ab4',faint:'#5e5e78',from:'#6366f1',to:'#a855f7'},
  aurora:   {bg:'#07131a',bgElev:'#0d1d26',surface:'#132833',surfaceHover:'#1a3442',border:'#1f3a48',text:'#eefbff',muted:'#8fb3c2',faint:'#53707d',from:'#14b8a6',to:'#38bdf8'},
  graphite: {bg:'#121214',bgElev:'#1a1a1d',surface:'#202024',surfaceHover:'#2a2a2f',border:'#303036',text:'#ececf0',muted:'#9a9aa3',faint:'#606068',from:'#8b8b96',to:'#c4c4cc'},
  sunset:   {bg:'#170d0b',bgElev:'#21130f',surface:'#2a1915',surfaceHover:'#36221c',border:'#3d2820',text:'#fff4ee',muted:'#c0998a',faint:'#7a5a4f',from:'#f97316',to:'#ec4899'},
  forest:   {bg:'#0a120d',bgElev:'#101b13',surface:'#162318',surfaceHover:'#1d2f20',border:'#233826',text:'#effaf1',muted:'#97b59d',faint:'#5b7560',from:'#22c55e',to:'#84cc16'},
  paper:    {bg:'#f7f6f2',bgElev:'#ffffff',surface:'#ffffff',surfaceHover:'#f1efe8',border:'#e4e1d8',text:'#1c1c22',muted:'#5f5f6b',faint:'#9a9aa6',from:'#4f46e5',to:'#7c3aed'},
  amoled:   {bg:'#000000',bgElev:'#070707',surface:'#0f0f0f',surfaceHover:'#171717',border:'#202020',text:'#f5f5f5',muted:'#8a8a8a',faint:'#4a4a4a',from:'#6366f1',to:'#a855f7'}
};
// код погоды (WMO) → [иконка, описание]
const WX = {
  0:['☀️','Ясно'],1:['🌤️','Преимущественно ясно'],2:['⛅','Переменная облачность'],3:['☁️','Пасмурно'],
  45:['🌫️','Туман'],48:['🌫️','Изморозь'],
  51:['🌦️','Лёгкая морось'],53:['🌦️','Морось'],55:['🌧️','Сильная морось'],56:['🌧️','Ледяная морось'],57:['🌧️','Ледяная морось'],
  61:['🌦️','Небольшой дождь'],63:['🌧️','Дождь'],65:['🌧️','Сильный дождь'],66:['🌧️','Ледяной дождь'],67:['🌧️','Ледяной дождь'],
  71:['🌨️','Небольшой снег'],73:['🌨️','Снег'],75:['❄️','Сильный снег'],77:['🌨️','Снежная крупа'],
  80:['🌦️','Ливень'],81:['🌧️','Ливень'],82:['⛈️','Сильный ливень'],
  85:['🌨️','Снегопад'],86:['❄️','Сильный снегопад'],
  95:['⛈️','Гроза'],96:['⛈️','Гроза с градом'],99:['⛈️','Гроза с градом']
};
const MODE_NAMES = { month:'Месяц', week:'Неделя', day:'День' };

/* ================= Утилиты ================= */
const $ = sel => document.querySelector(sel);
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDate = s => new Date(s + 'T00:00');
const todayStr = () => fmtDate(new Date());
const dayAdd = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return fmtDate(d); };
const addDays = n => dayAdd(todayStr(), n);
const fmtLong = s => parseDate(s).toLocaleDateString('ru', {weekday:'long', day:'numeric', month:'long'});
const fmtShort = s => parseDate(s).toLocaleDateString('ru', {day:'numeric', month:'short'});
const weekdayShort = s => parseDate(s).toLocaleDateString('ru', {weekday:'short'});
const fmtMin = m => { const h = Math.floor(m/60), mm = m % 60; return h ? `${h} ч ${mm} мин` : `${mm} мин`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMin = hm => { const [h, m] = hm.split(':').map(Number); return h*60 + m; };
const fromMin = m => { m = Math.max(0, Math.min(1439, Math.round(m))); return pad(Math.floor(m/60)) + ':' + pad(m % 60); };
const byTime = (a, b) => (a.time || '99:99').localeCompare(b.time || '99:99');
const byDateTime = (a, b) => (a.date + (a.time || '99:99')).localeCompare(b.date + (b.time || '99:99'));

function fmtTime(hm){
  if (S.settings.timeFormat !== '12') return hm;
  const [h, m] = hm.split(':').map(Number);
  return `${(h % 12) || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`;
}

const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const isHM = s => typeof s === 'string' && /^\d{2}:\d{2}$/.test(s);
function validTask(t){
  return t && typeof t.id === 'string' && typeof t.title === 'string' && t.title.length <= 500 &&
    isDate(t.date) && [1,2,3,4].includes(t.prio) && typeof t.done === 'boolean';
}
function validEvent(e){
  return e && typeof e.id === 'string' && typeof e.title === 'string' && e.title.length <= 300 &&
    isDate(e.date) && (!e.start || isHM(e.start)) && (!e.end || isHM(e.end));
}
function validWeather(w){
  return w && typeof w.lat === 'number' && typeof w.lon === 'number' &&
    Math.abs(w.lat) <= 90 && Math.abs(w.lon) <= 180 && typeof w.name === 'string';
}
function sanitizeSettings(s){
  const o = {...DEFAULTS};
  if (!s || typeof s !== 'object') return o;
  if (PRESETS[s.preset]) o.preset = s.preset;
  const hex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v) ? v : null;
  o.accent = hex(s.accent); o.accent2 = hex(s.accent2);
  if (typeof s.radius === 'number') o.radius = Math.min(32, Math.max(0, s.radius));
  if ([0.85, 1, 1.15].includes(Number(s.density))) o.density = Number(s.density);
  if (typeof s.fontScale === 'number') o.fontScale = Math.min(1.3, Math.max(0.85, s.fontScale));
  if ([0, 1].includes(s.weekStart)) o.weekStart = s.weekStart;
  if (['12', '24'].includes(s.timeFormat)) o.timeFormat = s.timeFormat;
  if (['month', 'week', 'day'].includes(s.calView)) o.calView = s.calView;
  return o;
}
function normalize(d){
  return {
    settings: sanitizeSettings(d.settings),
    tasks: (Array.isArray(d.tasks) ? d.tasks : []).filter(validTask),
    events: (Array.isArray(d.events) ? d.events : []).filter(validEvent),
    weather: validWeather(d.weather) ? d.weather : null
  };
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.tasks)) return normalize(d);
  }catch(e){}
  try{
    const old = JSON.parse(localStorage.getItem(OLD_KEY));
    if (old && Array.isArray(old.tasks)){
      return { settings: sanitizeSettings(old.settings), tasks: old.tasks.filter(validTask), events: [], weather: null };
    }
  }catch(e){}
  return { settings: {...DEFAULTS}, tasks: demoTasks(), events: demoEvents(), weather: null };
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Не удалось сохранить данные'); }
}

function applyTheme(){
  const s = S.settings, p = PRESETS[s.preset] || PRESETS.midnight, st = document.documentElement.style;
  const vars = {
    '--bg': p.bg, '--bg-elev': p.bgElev, '--surface': p.surface, '--surface-hover': p.surfaceHover,
    '--border': p.border, '--text': p.text, '--text-muted': p.muted, '--text-faint': p.faint,

/* ================= Undo и уведомления ================= */
function snapshot(){ return JSON.stringify({ tasks: S.tasks, events: S.events }); }
function mutate(fn, msg){
  past.push(snapshot());
  if (past.length > 100) past.shift();
  fn(); save(); render();
  if (msg) toast(msg, true);
}
function undo(){
  if (!past.length) return;
  const d = JSON.parse(past.pop());
  S.tasks = d.tasks; S.events = d.events;
  save(); render(); toast('Действие отменено');
}
function toast(msg, withUndo = false){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${withUndo ? '<button data-act="undo">Отменить</button>' : ''}`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
}

/* ================= Часы (системное время) ================= */
function greet(h){
  if (h >= 5 && h < 12) return 'Доброе утро';
  if (h >= 12 && h < 18) return 'Добрый день';
  if (h >= 18 && h < 23) return 'Добрый вечер';
  return 'Доброй ночи';
}
function longDate(n){
  return n.toLocaleDateString('ru', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
function fmtClock(n){
  const ss = pad(n.getSeconds());
  if (S.settings.timeFormat === '12'){
    return `${(n.getHours() % 12) || 12}:${pad(n.getMinutes())}:${ss} ${n.getHours() < 12 ? 'AM' : 'PM'}`;
  }
  return `${pad(n.getHours())}:${pad(n.getMinutes())}:${ss}`;
}
function tzLabel(){
  const off = -new Date().getTimezoneOffset();
  const sign = off >= 0 ? '+' : '−';
  let zone = '';
  try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
  return `${zone} · UTC${sign}${pad(Math.floor(Math.abs(off)/60))}:${pad(Math.abs(off) % 60)}`;
}
function tick(){
  const n = new Date();
  const clock = $('#clock');
  if (clock){
    clock.textContent = fmtClock(n);
    $('#dateLine').textContent = longDate(n);
    $('#greet').textContent = greet(n.getHours());
  }
  const next = $('#wxNext');
  if (next && W.at) next.textContent = nextUpdateText();

  const day = fmtDate(n);
  if (day !== lastDay){
    lastDay = day;
    if (VIEW === 'today' || VIEW === 'calendar') render();
  }
  if (focusEnd){
    if (Date.now() >= focusEnd){
      focusEnd = null;
      toast('Фокус-сессия завершена');
      render();
    } else {
      const el = $('#focusTime');
      if (el) el.textContent = focusLabel();
    }
  }
}
function scheduleTick(){
  // выравнивание на начало следующей секунды системных часов
  setTimeout(() => { tick(); scheduleTick(); }, 1000 - (Date.now() % 1000) + 5);
}

/* ================= Погода (Open-Meteo, обновление каждые 15 минут) ================= */
function wxGroup(code){
  if (code >= 95) return 'wx-storm';
  if (code >= 85 || (code >= 71 && code <= 77)) return 'wx-snow';
  if (code >= 51) return 'wx-rain';
  if (code >= 45) return 'wx-fog';
  if (code >= 2) return 'wx-cloud';
  return 'wx-clear';
}
function wxIcon(code, isDay){
  if (code <= 1 && !isDay) return '🌙';
  return (WX[code] || ['🌡️'])[0];
}
function parseWeather(d){
  const c = d.current, h = d.hourly, dl = d.daily;
  const nowKey = c.time.slice(0, 13) + ':00';
  let idx = h.time.findIndex(t => t >= nowKey);
  if (idx < 0) idx = 0;
  const hourly = h.time.slice(idx, idx + 12).map((t, i) => ({
    t, temp: Math.round(h.temperature_2m[idx + i]), code: h.weather_code[idx + i]
  }));
  const daily = dl.time.map((t, i) => ({
    t, max: Math.round(dl.temperature_2m_max[i]), min: Math.round(dl.temperature_2m_min[i]), code: dl.weather_code[i]
  }));
  return {
    temp: Math.round(c.temperature_2m), feels: Math.round(c.apparent_temperature), code: c.weather_code,
    wind: Math.round(c.wind_speed_10m), hum: c.relative_humidity_2m, isDay: c.is_day === 1,
    hourly, daily, at: Date.now()
  };
}
async function getJSON(url){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try{
    const r = await fetch(url, {signal: ctrl.signal});
    if (!r.ok) throw new Error('http ' + r.status);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}
async function loadWeather(){
  if (!S.weather || W.loading) return;
  W.loading = true;
  paintWeather();
  const w = S.weather;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}` +
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day` +
    `&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min` +
    `&timezone=auto&forecast_days=4`;
  try{
    W.data = parseWeather(await getJSON(url));
    W.at = Date.now();
    W.error = null;
  }catch(e){
    W.error = 'Не удалось загрузить погоду. Проверьте подключение к интернету.';
  }finally{
    W.loading = false;
    paintWeather();
  }
}

/* ================= Быстрый ввод ================= */
const WEEKDAYS = { воскр:0, понед:1, втор:2, сред:3, четв:4, пятн:5, субб:6 };
function parseQuick(input){
  let rest = input.trim();
  if (!rest) return null;
  let date = todayStr(), time = null, tag = null, prio = 4, est = null, m;
  const cut = re => {
    const found = rest.match(re);
    if (found) rest = rest.replace(found[0], ' ');
    return found;
  };
  if (cut(/\bпослезавтра\b/i)) date = addDays(2);
  else if (cut(/\bзавтра\b/i)) date = addDays(1);
  else if (cut(/\bсегодня\b/i)) date = todayStr();
  else if ((m = cut(/\b(понедельник|вторник|сред[ауе]|четверг|пятниц[ауе]|суббот[ауе]|воскресень[ея])\b/i))){
    const key = Object.keys(WEEKDAYS).find(k => m[1].toLowerCase().startsWith(k));
    const diff = ((WEEKDAYS[key] - new Date().getDay()) + 7) % 7 || 7;
    date = addDays(diff);
  }
  if ((m = cut(/(?:\bв\s+)?(\d{1,2})[:.](\d{2})\b/))) time = pad(m[1]) + ':' + m[2];
  else if ((m = cut(/\bв\s+(\d{1,2})\b/i))) time = pad(m[1]) + ':00';
  if ((m = cut(/#(\S+)/))) tag = m[1];
  if ((m = cut(/!(срочно|высокий|средний|низкий)/i))){
    prio = {срочно:1, высокий:2, средний:3, низкий:4}[m[1].toLowerCase()];
  }
  if ((m = cut(/(\d+)\s*ч(?:ас\S*)?(?:\s*(\d+)\s*м\S*)?/i))) est = Number(m[1]) * 60 + Number(m[2] || 0);
  else if ((m = cut(/(\d+)\s*(?:мин\S*|м)\b/i))) est = Number(m[1]);
  const title = rest.replace(/\s+/g, ' ').trim();
  if (!title) return null;
  return { title, date, time, tag, prio, est };
}

/* ================= Элементы дня ================= */
function dayItems(date){
  const events = S.events.filter(e => e.date === date);
  const tasks = S.tasks.filter(t => t.date === date);
  const timed = [
    ...events.filter(e => e.start).map(e => ({kind:'event', id:e.id, title:e.title, start:e.start, end:e.end})),
    ...tasks.filter(t => t.time).map(t => ({
      kind:'task', id:t.id, title:t.title, start:t.time,
      end: fromMin(toMin(t.time) + (t.est || 30)), prio:t.prio, done:t.done
    }))
  ].sort((a, b) => a.start.localeCompare(b.start));
  const allDay = [
    ...events.filter(e => !e.start).map(e => ({kind:'event', id:e.id, title:e.title})),
    ...tasks.filter(t => !t.time).map(t => ({kind:'task', id:t.id, title:t.title, prio:t.prio, done:t.done}))
  ];
  return { timed, allDay };
}
// раскладка пересекающихся блоков в параллельные колонки
function layoutLanes(items){
  const lanes = [];
  items.forEach(it => {
    const s = toMin(it.start);
    const e = Math.max(s + 20, it.end ? toMin(it.end) : s + 30);
    let lane = lanes.findIndex(end => end <= s);
    if (lane === -1){ lane = lanes.length; lanes.push(e); }
    else lanes[lane] = e;
    it.lane = lane; it.s = s; it.e = e;
  });
  const n = Math.max(1, lanes.length);
  items.forEach(it => { it.n = n; });
  return items;
}
function chipHTML(it){
  if (it.kind === 'event'){
    return `<div class="pill ev-pill" data-act="evEdit" data-id="${it.id}" title="${esc(it.title)}">${esc(it.title)}</div>`;
  }
  return `<div class="pill tk-pill p${it.prio}${it.done ? ' done' : ''}" data-act="toggle" data-id="${it.id}" title="${esc(it.title)}">${esc(it.title)}</div>`;
}
function timelineHTML(dates){
  const today = todayStr();
  const items = dates.map(dayItems);
  const head = dates.map(d => `<div class="dayhead ${d === today ? 'today' : ''}">
      <span class="muted small">${weekdayShort(d)}</span><br><b>${parseDate(d).getDate()}</b></div>`).join('');
  const allday = items.map(it => `<div class="allday">${it.allDay.map(chipHTML).join('')}</div>`).join('');
  const hours = Array.from({length: 24}, (_, h) => `<div>${fmtTime(pad(h) + ':00')}</div>`).join('');
  const cols = dates.map((d, i) => {
    const timed = layoutLanes(items[i].timed);
    const blocks = timed.map(it => {
      const top = it.s / 60 * HOUR_PX;
      const height = Math.max(24, (it.e - it.s) / 60 * HOUR_PX);
      const w = 100 / it.n;
      const cls = it.kind === 'task' ? `blk task p${it.prio}${it.done ? ' done' : ''}` : 'blk ev';
      const act = it.kind === 'task' ? 'toggle' : 'evEdit';
      return `<div class="${cls}" data-act="${act}" data-id="${it.id}"
        style="top:${top}px;height:${height}px;left:calc(${it.lane * w}% + 2px);width:calc(${w}% - 4px)">
        <b>${esc(it.title)}</b><div class="muted">${fmtTime(it.start)}${it.end ? ' – ' + fmtTime(it.end) : ''}</div></div>`;
    }).join('');
    const nowLine = d === today ? `<div class="now-line" style="top:${nowMin() / 60 * HOUR_PX}px"></div>` : '';
    return `<div class="tl-col" data-act="slot" data-date="${d}">${blocks}${nowLine}</div>`;
  }).join('');
  return `<div class="tl-wrap"><div class="tl-inner" style="--cols:${dates.length}">
    <div class="tl-row">${'<div></div>' + head}</div>
    <div class="tl-row allrow"><div class="tl-gutter muted">Весь день</div>${allday}</div>
    <div class="tl-row"><div class="tl-hours">${hours}</div>${cols}</div>
  </div></div>`;
}
function nowMin(){
  const n = new Date();
  return n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60;
}
function weekStart(date){
  const d = parseDate(date);
  d.setDate(d.getDate() - ((d.getDay() - S.settings.weekStart + 7) % 7));
  return fmtDate(d);
}
function monthHTML(base){
  const b = parseDate(base);
  const first = new Date(b.getFullYear(), b.getMonth(), 1);
  const ws = S.settings.weekStart;
  const today = todayStr();
  const start = new Date(first);
  start.setDate(first.getDate() - ((first.getDay() - ws + 7) % 7));
  const names = Array.from({length: 7}, (_, i) =>
    new Date(2024, 0, 7 + ((ws + i) % 7)).toLocaleDateString('ru', {weekday:'short'}));
  let cells = '';
  for (let i = 0; i < 42; i++){
    const x = new Date(start);
    x.setDate(start.getDate() + i);
    const ds = fmtDate(x);
    const it = dayItems(ds);
    const all = [
      ...it.allDay.map(p => ({...p, time: null})),
      ...it.timed.map(p => ({...p, time: p.start}))
    ];
    const shown = all.slice(0, 3).map(p => {
      const cls = p.kind === 'event' ? 'ev-pill' : 'tk-pill p' + p.prio;
      return `<div class="pill ${cls}">${p.time ? esc(fmtTime(p.time)) + ' ' : ''}${esc(p.title)}</div>`;
    }).join('');
    const more = all.length > 3 ? `<div class="more">+${all.length - 3}</div>` : '';
    cells += `<div class="cell ${x.getMonth() !== b.getMonth() ? 'other' : ''} ${ds === today ? 'today' : ''}"
      data-act="dayPick" data-date="${ds}"><div class="num">${x.getDate()}</div>${shown}${more}</div>`;
  }
  return `<div class="month">${names.map(n => `<div class="wd">${n}</div>`).join('')}${cells}</div>`;
}
function calTitle(mode, date){
  const d = parseDate(date);
  if (mode === 'month') return d.toLocaleDateString('ru', {month:'long', year:'numeric'});
  if (mode === 'week'){
    const s = parseDate(weekStart(date));
    const e = new Date(s);
    e.setDate(s.getDate() + 6);
    return `${s.toLocaleDateString('ru', {day:'numeric', month:'short'})} – ${e.toLocaleDateString('ru', {day:'numeric', month:'short', year:'numeric'})}`;
  }
  return d.toLocaleDateString('ru', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
}
function shiftCal(date, mode, dir){
  const d = parseDate(date);
  if (mode === 'month'){ d.setDate(1); d.setMonth(d.getMonth() + dir); }
  else if (mode === 'week') d.setDate(d.getDate() + 7 * dir);
  else d.setDate(d.getDate() + dir);
  return fmtDate(d);
}
function viewCalendar(){
  const mode = S.settings.calView;
  let body;
  if (mode === 'month') body = monthHTML(CAL.date);
  else if (mode === 'week'){
    const s = weekStart(CAL.date);
    body = timelineHTML(Array.from({length: 7}, (_, i) => dayAdd(s, i)));
  } else {
    body = timelineHTML([CAL.date]);
  }
  return `
    <header class="head"><h1>Календарь</h1>
      <div class="muted small">Клик по пустому времени — новое событие. Задачи с временем тоже видны.</div></header>
    <div class="cal-bar">
      <button class="btn-ghost" data-act="calPrev" aria-label="Назад">‹</button>
      <button class="btn-ghost" data-act="calToday">Сегодня</button>
      <button class="btn-ghost" data-act="calNext" aria-label="Вперёд">›</button>
      <h2 class="cal-title">${esc(calTitle(mode, CAL.date))}</h2>
      <div class="grow"></div>
      <div class="seg">${Object.keys(MODE_NAMES).map(m =>
        `<button data-act="calMode" data-id="${m}" class="${m === mode ? 'on' : ''}">${MODE_NAMES[m]}</button>`).join('')}</div>
      <button class="btn-primary" data-act="evNew">+ Событие</button>
    </div>
    ${body}`;
}

/* ================= Диалог события ================= */
function openEvent(ev, def = {}){
  editingEventId = ev ? ev.id : null;
  $('#evTitle').textContent = ev ? 'Редактировать событие' : 'Новое событие';
  $('#evName').value = ev ? ev.title : '';
  $('#evDate').value = ev ? ev.date : (def.date || CAL.date);
  $('#evStart').value = ev ? (ev.start || '') : (def.start || '');
  $('#evEnd').value = ev ? (ev.end || '') : (def.end || '');
  $('#evPlace').value = ev ? (ev.place || '') : '';
  $('#evDel').hidden = !ev;
  $('#evDlg').showModal();
  setTimeout(() => $('#evName').focus(), 0);
}
function saveEvent(){
  const title = $('#evName').value.trim();
  if (!title){ toast('Введите название события'); return; }
  const date = $('#evDate').value || todayStr();
  const start = $('#evStart').value || null;
  let end = start ? ($('#evEnd').value || null) : null;
  if (start && (!end || toMin(end) <= toMin(start))) end = fromMin(toMin(start) + 60);
  const ev = { id: editingEventId || uid(), title, date, start, end, place: $('#evPlace').value.trim() || null };
  $('#evDlg').close();
  mutate(() => {
    if (editingEventId){
      const i = S.events.findIndex(e => e.id === editingEventId);
      if (i >= 0) S.events[i] = ev;
    } else {
      S.events.push(ev);
    }
    CAL.date = ev.date;
  }, 'Событие сохранено');
}
function deleteEvent(){
  const id = editingEventId;
  if (!id) return;
  $('#evDlg').close();
  mutate(() => { S.events = S.events.filter(e => e.id !== id); }, 'Событие удалено');
}

    t.date !== todayStr() ? fmtShort(t.date) : null,
    t.time ? fmtTime(t.time) : null,
    t.est ? fmtMin(t.est) : null
  ].filter(Boolean).join(' · ');
  return `<div class="row ${t.done ? 'is-done' : ''}">
    <button class="check ${t.done ? 'on' : ''}" data-act="toggle" data-id="${t.id}" aria-label="Отметить выполненной"></button>
    <div class="grow">
      <div class="title-sm">${esc(t.title)}</div>

function eventRowHTML(e){

}
function viewToday(){

  const list = S.tasks.filter(t => t.date === today).sort(byTime);
  const events = S.events.filter(e => e.date === today).sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  const doneN = list.filter(t => t.done).length;
  const minsLeft = list.filter(t => !t.done).reduce((s, t) => s + (t.est || 0), 0);
  const pct = list.length ? Math.round(doneN / list.length * 100) : 0;
  const n = new Date();
  const hm = pad(n.getHours()) + ':' + pad(n.getMinutes());
  const current = list.find(t => !t.done && t.time && t.time >= hm) || list.find(t => !t.done);

  return `
    <div class="hero">
      <div class="card clock-card">
        <div>
          <div class="muted small" id="greet">${greet(n.getHours())}</div>
          <div class="clock" id="clock">${esc(fmtClock(n))}</div>
          <div class="muted" id="dateLine">${esc(longDate(n))}</div>
        </div>
        <div class="sync small muted"><i></i><span>Системное время · ${esc(tzLabel())}</span></div>
      </div>
      <div id="wx" class="card wx"></div>
    </div>

    <div class="card progress">
      <div class="row-between">
        <span>${doneN} из ${list.length} · ${minsLeft ? 'осталось ' + fmtMin(minsLeft) : 'всё выполнено'}</span>
        <span>${pct}%</span>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>

    ${current ? `<div class="card now">
      <div>
        <div class="muted small">Сейчас</div>
        <div class="title">${esc(current.title)}</div>
        <div class="muted small">${current.time ? esc(fmtTime(current.time)) : 'без времени'}</div>
      </div>
      <div class="grow"></div>
      <div class="timer" id="focusTime">${focusLabel()}</div>
      <button class="btn-primary" data-act="focus">▶ Начать фокус</button>

    <section class="card">
      <div class="row-between"><b>События сегодня</b><button class="btn-ghost" data-act="evNew">+ Событие</button></div>
      ${events.length ? events.map(eventRowHTML).join('') : '<p class="muted small">Событий на сегодня нет</p>'}
    </section>

    ${overdue.length ? `<section class="card">
      <div class="row-between"><b>Просрочено — перенести?</b><button class="btn-ghost" data-act="allToday">Всё на сегодня</button></div>
      ${overdue.map(taskRowHTML).join('')}
    </section>` : ''}

    <section class="card">
      <div class="row-between"><b>Задачи</b></div>
      ${list.length ? list.map(taskRowHTML).join('')
        : '<p class="muted">На сегодня задач нет. Добавьте одну внизу, например: «завтра в 15:00 созвон #работа !высокий»</p>'}
    </section>`;
}
function viewWeek(){
  let out = '<header class="head"><h1>Неделя</h1></header>';
  for (let i = 0; i < 7; i++){
    const d = addDays(i);
    const tasks = S.tasks.filter(t => t.date === d).sort(byTime);
    const events = S.events.filter(e => e.date === d);
    const open = tasks.filter(t => !t.done).length;
    out += `<section class="card">
      <div class="row-between"><b>${esc(fmtLong(d))}</b>
        <span class="muted small">${open} в работе · ${events.length} событий</span></div>
      ${events.map(eventRowHTML).join('')}
      ${tasks.length ? tasks.map(taskRowHTML).join('') : (events.length ? '' : '<p class="muted small">Пусто</p>')}
    </section>`;
  }
  return out;
}
function viewStats(){
  const done = S.tasks.filter(t => t.done && t.completedAt);
  const weekAgo = Date.now() - 7 * 864e5;
  const last7 = done.filter(t => new Date(t.completedAt).getTime() >= weekAgo).length;
  const doneDays = new Set(done.map(t => fmtDate(new Date(t.completedAt))));
  let streak = 0;
  for (let i = 0; i < 365; i++){
    if (doneDays.has(addDays(-i))) streak++;
    else if (i > 0) break;
  }
  const counts = [];
  for (let i = 13; i >= 0; i--){
    const d = addDays(-i);
    counts.push({ d, n: done.filter(t => fmtDate(new Date(t.completedAt)) === d).length });
  }
  const max = Math.max(1, ...counts.map(c => c.n));
  return `
    <header class="head"><h1>Статистика</h1><div class="muted">Считается по выполненным задачам</div></header>
    <div class="kpis">
      <div class="card kpi"><span class="muted small">За 7 дней</span><b>${last7}</b></div>
      <div class="card kpi"><span class="muted small">Всего выполнено</span><b>${done.length}</b></div>
      <div class="card kpi"><span class="muted small">Серия дней 🔥</span><b>${streak}</b></div>
      <div class="card kpi"><span class="muted small">Событий в календаре</span><b>${S.events.length}</b></div>
    </div>
    <section class="card"><h3>Последние 14 дней</h3>
      <div class="bars">${counts.map(c =>
        `<div class="bar-col" title="${esc(fmtShort(c.d))}: ${c.n}"><i style="height:${c.n / max * 100}%"></i></div>`).join('')}</div>
    </section>`;
}

      <label>Масштаб текста: <output>${s.fontScale.toFixed(2)}</output>
        <input type="range" min="0.85" max="1.3" step="0.05" data-set="fontScale" value="${s.fontScale}"></label>
    </section>

    <section class="card"><h3>Календарь и время</h3>
      <div class="grid2">

const VIEWS = { today: viewToday, calendar: viewCalendar, week: viewWeek, stats: viewStats, settings: viewSettings };
function render(){
  document.querySelectorAll('nav [data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === VIEW));
  $('#main').innerHTML = VIEWS[VIEW]();
  if (VIEW === 'today') paintWeather();
}

/* ================= Обработчики ================= */
function exportData(){
  const blob = new Blob([JSON.stringify({version: 2, ...S}, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'focusflow.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function resetAll(){
  if (!confirm('Удалить все задачи, события и настройки?')) return;
  S = { settings: {...DEFAULTS}, tasks: [], events: [], weather: null };
  past = [];
  save(); applyTheme(); render(); toast('Всё сброшено');
}

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-view]');
  if (nav){
    VIEW = nav.dataset.view;
    if (VIEW === 'calendar') CAL.date = todayStr();
    render();
    return;
  }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act, id = btn.dataset.id;
  const task = id ? S.tasks.find(t => t.id === id) : null;

  switch (act){
    case 'toggle':
      if (task) mutate(() => {
        task.done = !task.done;
        task.completedAt = task.done ? new Date().toISOString() : null;
      });
      break;
    case 'del':
      if (task) mutate(() => { S.tasks = S.tasks.filter(t => t.id !== id); }, 'Задача удалена');
      break;
    case 'tomorrow':
      if (task) mutate(() => { task.date = addDays(1); }, 'Перенесено на завтра');
      break;
    case 'allToday':
      mutate(() => {
        const t = todayStr();
        S.tasks.forEach(x => { if (!x.done && x.date < t) x.date = t; });
      }, 'Просроченное перенесено');
      break;
    case 'focus':
      focusEnd = Date.now() + FOCUS_MS;
      render();
      break;
    case 'undo': undo(); break;

    case 'preset':
      S.settings.preset = id; S.settings.accent = null; S.settings.accent2 = null;
      applyTheme(); save(); render();
      break;

    case 'calPrev': CAL.date = shiftCal(CAL.date, S.settings.calView, -1); render(); break;
    case 'calNext': CAL.date = shiftCal(CAL.date, S.settings.calView, 1); render(); break;
    case 'calToday': CAL.date = todayStr(); render(); break;
    case 'calMode': S.settings.calView = id; save(); render(); break;
    case 'dayPick':
      CAL.date = btn.dataset.date;
      S.settings.calView = 'day';
      save(); render();
      break;
    case 'slot': {
      const rect = btn.getBoundingClientRect();
      const minutes = Math.max(0, Math.min(1439, (e.clientY - rect.top) / HOUR_PX * 60));
      const start = fromMin(Math.floor(minutes / 15) * 15);
      openEvent(null, {date: btn.dataset.date, start, end: fromMin(toMin(start) + 60)});
      break;
    }
    case 'evNew': openEvent(null, {date: CAL.date}); break;
    case 'evEdit': {
      const ev = S.events.find(x => x.id === id);
      if (ev) openEvent(ev);
      break;
    }
    case 'evSave': saveEvent(); break;
    case 'evDel': deleteEvent(); break;
    case 'evCancel': $('#evDlg').close(); break;

    case 'wxEdit':
      W.editing = true; W.results = [];
      if (VIEW !== 'today'){ VIEW = 'today'; render(); } else paintWeather();
      break;
    case 'wxClose':
      W.editing = false;
      if (VIEW !== 'today') render(); else paintWeather();
      break;
    case 'wxSearch': searchCity(); break;
    case 'wxGeo': useGeolocation(); break;
    case 'wxPick': pickCity(Number(id)); break;
    case 'wxRetry': loadWeather(); break;

    case 'export': exportData(); break;
    case 'demo':
      S.tasks = S.tasks.concat(demoTasks());
      S.events = S.events.concat(demoEvents());
      save(); render(); toast('Демо-данные добавлены');
      break;
    case 'reset': resetAll(); break;
  }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'cityQ'){ W.query = el.value; return; }
  const key = el.dataset && el.dataset.set;
  if (!key) return;
  let v = el.value;
  if (['radius', 'density', 'fontScale', 'weekStart'].includes(key)) v = Number(v);
  S.settings[key] = v;
  if (el.type === 'range'){
    const out = el.closest('label')?.querySelector('output');
    if (out) out.textContent = key === 'fontScale' ? Number(v).toFixed(2) : v;
  }
  applyTheme(); save();
  if (['timeFormat', 'weekStart', 'calView'].includes(key)) render();
});

document.addEventListener('change', e => {
  if (e.target.id !== 'importFile') return;
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if (!d || typeof d !== 'object' || !Array.isArray(d.tasks)) throw new Error('bad format');
      S = normalize(d);
      past = [];
      save(); applyTheme(); render(); toast('Импорт выполнен');
    }catch(err){
      toast('Файл повреждён или имеет неверный формат');
    }
  };
  reader.readAsText(file);
});

const quick = $('#quick');
quick.addEventListener('input', () => { $('#preview').innerHTML = previewHTML(parseQuick(quick.value)); });
quick.addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); addFromInput(); }
});

document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (e.key === 'Enter' && e.target.id === 'cityQ'){ e.preventDefault(); searchCity(); return; }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !typing){
    e.preventDefault(); undo(); return;
  }
  if (e.key === 'n' && !typing && !e.ctrlKey && !e.metaKey && !$('#evDlg').open){
    e.preventDefault(); quick.focus(); return;
  }
  if (e.key === 'Escape'){
    quick.blur();
    $('#toast').hidden = true;
  }
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.weather && Date.now() - W.at > WX_INTERVAL) loadWeather();
});

/* ================= Старт ================= */
S = load();
applyTheme();
render();
scheduleTick();
loadWeather();
setInterval(() => { if (S.weather) loadWeather(); }, WX_INTERVAL);
</script>
</body>
</html>
